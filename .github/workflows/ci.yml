name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # -------------------------------------------------------------------------
  # Stage 1: lint — shellcheck + bash syntax. Pure static analysis.
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck + bash syntax + python lib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning isopod lib/isopod.d/*.sh install.sh test/run.sh test/packaging.sh test/egress-render.sh test/brew-formula.sh test/distro-install.sh verify-host-isolation.sh
          bash -n isopod lib/isopod.d/*.sh install.sh verify-host-isolation.sh
          # lint the discrete python helpers under lib/
          sudo apt-get install -y -qq python3 python3-pyflakes
          python3 -m py_compile lib/*.py
          python3 -m pyflakes lib/*.py

  # -------------------------------------------------------------------------
  # Stage 2: test — stubbed bats suite + interactive pexpect tests.
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: stubbed bats + interactive
        run: |
          sudo apt-get update -qq
          # Install core test deps first, on their own line, so they always
          # land even if an optional package on another line is unavailable.
          sudo apt-get install -y -qq bash openssh-client python3 python3-pexpect
          # nftables lets test/egress-render.sh parse-check the rendered egress
          # rulesets (nft -c). GitHub Linux runners can load nf_tables; where a
          # runner can't, the check skips itself rather than failing.
          sudo apt-get install -y -qq nftables || true
          bash test/run.sh

  # -------------------------------------------------------------------------
  # Stage 2 (macOS): the same lint + stubbed + interactive suite on a real Mac.
  # macOS ships a BSD userland (stat/sed differ from GNU) and its own git
  # default branch, and several code paths branch on is_macos(); this job keeps
  # those portability paths green. No container engine runs here — the live
  # suite needs `podman machine`, i.e. Hypervisor.framework / nested virt, which
  # GitHub-hosted macOS runners do not provide. Run live on a podman-capable Mac
  # (or self-hosted runner) with:  RUN_LIVE=1 test/run.sh
  # -------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: lint + stubbed bats + interactive (macOS / BSD userland)
        run: |
          # bats is vendored under test/libs; the linters, pexpect, and bash
          # are extra. Homebrew is preinstalled on macOS runners. bash: isopod
          # needs >= 4.4 and macOS /bin/bash is 3.2 — the isopod Homebrew
          # formula depends on `bash`, so CI tests with the same bash that real
          # brew installs get.
          brew install bash shellcheck shfmt
          # pexpect drives the interactive prompt tests; if it can't install,
          # test/run.sh skips them rather than failing.
          python3 -m pip install pexpect \
            || python3 -m pip install --break-system-packages pexpect \
            || true
          # Explicit path: the step shell is /bin/bash (3.2), so a bare `bash`
          # would depend on PATH order. Scripts launched FROM the suite resolve
          # `#!/usr/bin/env bash` via PATH, where Homebrew bin comes first.
          "$(brew --prefix)/bin/bash" test/run.sh

  # -------------------------------------------------------------------------
  # Distro install smoke: run install.sh for real on each Linux distro isopod
  # documents, and check it lands a working CLI and prints that distro's engine
  # hint. GitHub hosts only Ubuntu/Windows/macOS runners, so the other distros
  # run as container images on the Ubuntu runner.
  #
  # Deliberately cheap: no container engine is installed inside these images
  # (podman-in-podman needs a privileged runner — that is what live-isolation is
  # for), and no packages are installed at all — every image already has the
  # bash + coreutils install.sh needs. Cost is the image pull.
  #
  # The checkout happens on the runner (which has git) and is mounted into the
  # image read-only, so minimal images without git/node work unchanged.
  #
  # "fedora-immutable" is the plain Fedora image with /run/ostree-booted created:
  # that file is one of the signals install.sh uses to detect Silverblue/Kinoite/
  # Universal Blue, so it exercises the immutable branch without pulling a
  # multi-gigabyte ostree desktop image.
  # -------------------------------------------------------------------------
  distro-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            setup: "true"
            expect: dnf
          - name: fedora-immutable
            image: fedora:latest
            setup: "touch /run/ostree-booted"
            expect: rpm-ostree
          - name: ubuntu
            image: ubuntu:24.04
            setup: "true"
            expect: apt
          - name: arch
            image: archlinux:latest
            setup: "true"
            expect: pacman
          - name: gentoo
            image: gentoo/stage3:latest
            setup: "true"
            expect: emerge
    steps:
      - uses: actions/checkout@v5
      - name: install.sh smoke on ${{ matrix.name }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ${{ matrix.image }} \
            bash -c '${{ matrix.setup }} && bash test/distro-install.sh ${{ matrix.expect }}'

  # -------------------------------------------------------------------------
  # Homebrew formula: install isopod through the real tap formula, built from
  # this checkout, then `brew test`. Catches a formula whose install method
  # omits something the code needs at runtime (e.g. share/) — a class of bug the
  # in-repo packaging check can't see, since the formula lives in the separate
  # jonathanmcsweet/homebrew-isopod tap. Ubuntu runners don't ship Homebrew, so
  # the official setup action installs/configures it first.
  # -------------------------------------------------------------------------
  brew-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Homebrew/actions/setup-homebrew@main
      - name: install + test via the tap formula
        run: bash test/brew-formula.sh

  # -------------------------------------------------------------------------
  # Stage 3: live — real containers, exercising the isolation guarantees.
  #
  # Needs a runner that can run podman inside the job. GitHub's shared runners
  # and `act` are unprivileged and cannot create the user namespaces this
  # requires, so it never runs automatically — trigger it by hand from the
  # Actions tab (workflow_dispatch), point it at a podman-capable self-hosted
  # runner, or just run it locally:
  #
  #   RUN_LIVE=1 test/run.sh
  #
  # microVM tier (krun/kata): GitHub-hosted Linux runners DO expose /dev/kvm, so
  # a KVM microVM can in principle boot here — but nested virt is flaky and the
  # rootless-podman default cannot enforce the egress firewall, so we do not run
  # a microVM matrix in hosted CI. Test that tier on a KVM-capable self-hosted
  # runner. GitLab.com shared runners have no /dev/kvm at all.
  #
  # Live `egress allow-list` testing additionally needs nftables + tinyproxy +
  # systemd on the runner (the proxy is a systemd unit); the render/parse checks
  # in test/egress-render.sh cover the static side without any of that.
  # -------------------------------------------------------------------------
  live-isolation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: quay.io/podman/stable     # ships podman; needs a capable runner
    env:
      RUN_LIVE: "1"
      # vfs avoids needing overlay/fuse in constrained CI; slower but portable
      STORAGE_DRIVER: "vfs"
      ISOPOD_TEST_IMAGE: "debian:bookworm-slim"
    steps:
      - uses: actions/checkout@v5
      - name: live end-to-end (real podman)
        run: |
          dnf install -y openssh-clients python3 >/dev/null 2>&1 || true
          test/libs/bats-core/bin/bats test/live.bats
