# isopod strict kernel-hardening profile: extra guest sysctls, opt-in.
#
# Applied by the box entrypoint (share/isopod-entrypoint) ON TOP OF
# share/hardening-sysctl.conf, and only on microVM boxes created with
# `--harden strict`. Same best-effort rule as the default profile: a key the
# guest kernel does not expose is skipped, never fatal.
#
# These are the toggles the default profile deliberately leaves alone, because
# each one takes away something a developer might be using. Choose strict for a
# box that runs untrusted code and does not need any of it.
#
# What strict costs you in the box:
#   nested containers   rootless podman/docker needs user namespaces
#   io_uring            anything built on it stops working
#   profiling           perf, bpftrace, and other eBPF tooling stop working
#
# Named in the old default-profile comment but not here:
#   kernel.modules_disabled     libkrunfw builds CONFIG_MODULES=n, so the guest
#                               kernel has no module loader to disable
#   kernel.kexec_load_disabled  already in the default profile
#   kernel.yama.ptrace_scope    Yama is not built into the guest kernel, so the
#                               key does not exist and would need a kernel rebuild
#
# Format: one key=value per line ('#' comments and blank lines ignored).

# No eBPF for unprivileged users. One-way: it cannot be set back to 0.
kernel.unprivileged_bpf_disabled=1
# Disable io_uring for everyone, a large and repeatedly exploited syscall surface.
kernel.io_uring_disabled=2
# No new user namespaces, the starting point of most container escapes.
user.max_user_namespaces=0
# Level 3 (deny perf_event_open() to non-root) comes from a Debian/Ubuntu/Android
# patch. Upstream kernels, libkrunfw's included, treat 3 as 2: no kernel or
# CPU-wide profiling, but a process can still count events on itself. Set anyway,
# since it costs nothing and does the full job on a patched guest kernel.
kernel.perf_event_paranoid=3
# No userfaultfd for unprivileged users, a common primitive for winning kernel
# use-after-free races. Already 0 on this guest kernel; pinned so it stays 0.
vm.unprivileged_userfaultfd=0
