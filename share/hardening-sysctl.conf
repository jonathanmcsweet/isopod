# isopod default kernel-hardening profile — guest sysctls.
#
# Applied by the box entrypoint (share/isopod-entrypoint) ONLY on microVM boxes,
# where the box has its own guest kernel. isopod passes ISOPOD_HARDEN only for
# such boxes; a plain container shares the host kernel, so it is never asked to
# change these (that would affect the host). Applied best-effort: a key the guest
# kernel does not expose is skipped, never fatal.
#
# This is the DEFAULT profile: a deliberately conservative set chosen to shrink
# kernel attack surface WITHOUT breaking normal development. The heavier toggles
# (unprivileged_bpf_disabled, io_uring_disabled, modules_disabled,
# max_user_namespaces=0, lockdown, perf_event_paranoid) belong to the future
# 'strict' profile, not here, because they break nested containers, profiling,
# and eBPF/systems work.
#
# Format: one key=value per line ('#' comments and blank lines ignored).

# Hide kernel pointers from non-root (/proc/kallsyms, dmesg, etc.).
kernel.kptr_restrict=2
# Only root may read the kernel ring buffer (dmesg).
kernel.dmesg_restrict=1
# Constant-blind the eBPF JIT, raising the cost of JIT-spray exploits.
net.core.bpf_jit_harden=2
# One-way: forbid loading a new kernel via kexec (blocks a persistence/escape path).
kernel.kexec_load_disabled=1
