# security/compose.yaml — REFERENCE ONLY (isopod does NOT execute this file).
#
# isopod creates boxes with `podman run` / `docker run`, not Compose, so the live
# settings come from security/hardening.conf. This file documents the SAME
# fingerprint-hardening in Compose form, for anyone who prefers to launch (or
# adapt) a box with `podman compose` / `docker compose` instead of the CLI.
#
# Keep this in sync with security/hardening.conf if you change the masks.
#
# Engine note: the `security_opt: mask=` form below is Podman-only. Docker has no
# mask flag — for Docker, delete the `security_opt:` block and use the `tmpfs:`
# list shown in the commented-out section. Docker/runc REFUSES bind mounts onto
# `/proc` files, so `/proc/cmdline` and `/proc/modules` cannot be masked on
# Docker at all (a `/dev/null` bind aborts the run) — they stay readable there.
# Use Podman or a Tier 2/3 runtime to close them.

services:
  isopod:
    # isopod builds its base image inline (debian:bookworm-slim + sshd, git,
    # python3, sudo). Build it once with the CLI, or point at your own image:
    #   image must run sshd as PID 1 on port 22 (see the isopod script).
    image: localhost/isopod-base:1

    hostname: sandbox
    pids_limit: 4096

    # Loopback-only SSH — never exposed on the LAN, matching the CLI's behavior.
    ports:
      - "127.0.0.1::22"

    # --- Tier 2: sandboxed runtime (gVisor). Off by default. ---
    # Requires runsc installed AND registered with the engine on the host first.
    # runtime: runsc

    # --- Tier 1: mask host-revealing paths (PODMAN form) ---
    security_opt:
      - mask=/proc/cmdline:/proc/modules:/sys/class/dmi:/sys/devices/virtual/dmi:/sys/bus/pci:/sys/bus/usb:/sys/class/net:/sys/class/hwmon:/sys/class/thermal:/sys/class/drm:/sys/block:/sys/class/block:/sys/class/nvme:/sys/firmware

    # --- Tier 1: DOCKER equivalent (use these INSTEAD of security_opt above) ---
    # Directory masks only — Docker cannot mask /proc/cmdline or /proc/modules
    # (runc rejects /proc bind mounts), so those stay readable on Docker.
    # tmpfs:
    #   - /sys/class/dmi
    #   - /sys/devices/virtual/dmi
    #   - /sys/bus/pci
    #   - /sys/bus/usb
    #   - /sys/class/net
    #   - /sys/class/hwmon
    #   - /sys/class/thermal
    #   - /sys/class/drm
    #   - /sys/block
    #   - /sys/class/block
    #   - /sys/class/nvme
    #   - /sys/firmware

    # NOTE (matches hardening.conf): /proc/stat (host btime), /proc/cpuinfo,
    # /proc/meminfo, and /proc/version are intentionally NOT masked — doing so
    # breaks top/htop and build tools, and the CPU/kernel are readable via CPUID
    # and uname(2) regardless. The /sys/devices device tree is only partly masked
    # (DMI only); a Tier 2/3 runtime closes it. See the README
    # "What still can't be mitigated" section.
