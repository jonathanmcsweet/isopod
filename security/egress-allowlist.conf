# isopod egress allow-list BASELINE — hostnames a box may reach under
# `egress allow-list`. This is the shipped default. DO NOT EDIT IT — a package
# upgrade will overwrite your changes.
#
# To customize, create your OWN override in your config dir. It LAYERS on top of
# this baseline (you keep entries added in future upgrades) and survives upgrades:
#
#     ~/.config/isopod/egress-allowlist.conf   (or $ISOPOD_CONFIG_DIR/…)
#
# The fastest way to add one is:  isopod egress allow <domain>  — it appends to
# that override file and reloads the proxy without dropping connections.
#
# Format: one entry per line; `#` comments; blank lines ignored.
#   example.com     the domain AND all its subdomains (api.example.com, cdn.…)
#   *.example.com   subdomains only (not the apex example.com)
#
# Anything not matched here is DENIED by the host-side filtering proxy. The box
# reaches the proxy on the egress bridge gateway; it has no other route out, and
# an in-box agent (even root) cannot edit this list or the proxy — both live on
# the host. See docs/opt-in-security.md "Network egress allow-list".

# --- OS package repositories -------------------------------------------------
# MIRROR CAVEAT: Debian's deb.debian.org and Alpine's dl-cdn are single-host
# CDNs that work cleanly here. Fedora (mirrors.fedoraproject.org), openSUSE
# (MirrorCache), and Arch (mirrorlist) instead REDIRECT to third-party mirror
# hostnames this allow-list won't cover — point those managers at the official
# host (e.g. dnf `baseurl=…dl.fedoraproject.org`) or `isopod egress allow` the
# specific mirror you use.
*.debian.org                 # apt (Debian mirrors, security, snapshot)
deb.debian.org
*.ubuntu.com                 # apt (Ubuntu)
*.launchpad.net
fedoraproject.org            # dnf (dl./download./mirrors.fedoraproject.org)
opensuse.org                 # zypper (download.opensuse.org)
suse.com                     # zypper (SLES: updates./scc.suse.com)
alpinelinux.org              # apk (dl-cdn.alpinelinux.org — single-host CDN)
archlinux.org                # pacman (official host; mirrorlist points elsewhere)
kernel.org                   # Linux kernel source (cdn./git.kernel.org)

# --- language package registries ---------------------------------------------
pypi.org                     # pip
files.pythonhosted.org
registry.npmjs.org           # npm
crates.io                    # cargo
static.crates.io
proxy.golang.org             # go modules
sum.golang.org

# --- source hosting ----------------------------------------------------------
github.com                   # git clone/fetch over https (covers api./raw./codeload.)
*.githubusercontent.com
gitlab.com
codeberg.org                 # git clone/fetch over https (Codeberg / Forgejo)

# --- JavaScript / Node toolchain ---------------------------------------------
# npm registry itself is registry.npmjs.org (under "language package registries"
# above); pnpm, nx, turbo, and the TypeScript compiler + @types all pull their
# packages from there, so TypeScript needs no extra domain.
npmjs.com                    # npm website / login + token flow
nodejs.org                   # Node.js runtime downloads (nvm, pnpm, Volta, fnm)
get.pnpm.io                  # pnpm install script + standalone binary
# Remote cache / telemetry — opt-in, so commented out by default. Uncomment
# (or `isopod egress allow …`) if you use Nx Cloud or Turborepo remote caching.
#nx.app                      # Nx Cloud (cloud.nx.app — remote cache + telemetry)
#vercel.com                  # Turborepo remote cache + telemetry (api./telemetry.)

