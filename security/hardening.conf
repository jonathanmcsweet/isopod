# isopod container hardening BASELINE — Tier 1 masks + Tier 2/3 runtimes.
#
# This is the shipped default profile. DO NOT EDIT IT — it is a package file and
# an upgrade (Homebrew, install.sh, etc.) will overwrite your changes.
#
# To customize, create your OWN override file in your config dir. It LAYERS on
# top of this baseline (so you keep masks added in future upgrades) and survives
# upgrades:
#
#     ~/.config/isopod/hardening.conf       (or $ISOPOD_CONFIG_DIR/hardening.conf)
#
# Override directives (same format: one per line; `#` comments; blanks ignored):
#   mask <path> [file]   add a path to mask (append `file` for a single file)
#   unmask <path>        drop one of the baseline masks below
#   runtime <name>       run the box under a sandboxed OCI runtime:
#                          Tier 2 = syscall sandbox (runsc = gVisor), or
#                          Tier 3 = microVM with its own kernel (kata, krun;
#                          needs /dev/kvm). Same directive either way.
#   no-runtime           force the sandboxed runtime off
#   egress lan-deny      block a box from reaching your LAN, the host, cloud
#                          metadata, and internal DNS (host-enforced firewall);
#                          public internet + published ports keep working. See the
#                          "Network egress isolation" section below.
#   egress allow-list    default-deny egress: a host-side filtering proxy is the
#                          box's ONLY route out, and only allow-listed hostnames
#                          pass — to stop data exfiltration to arbitrary
#                          destinations. Edit the allow-list with
#                          `isopod egress allow <domain>`. Needs tinyproxy +
#                          systemd on the host. See the same section below.
#   no-egress            force egress isolation off
#
# Quick toggles, no file needed:  ISOPOD_RUNTIME=runsc isopod create ...
#                                 ISOPOD_EGRESS=lan-deny isopod create ...
#
# Example ~/.config/isopod/hardening.conf:
#   runtime runsc           # Tier 2: gVisor syscall sandbox
#   runtime krun            # Tier 3: microVM, separate kernel (needs /dev/kvm)
#   unmask /sys/class/net   # let the box see my NIC for this workflow
#   egress lan-deny         # stop a rogue agent from mapping the local network
#
# isopod reads the baseline + your override at `isopod create` time and translates
# each directive into the right podman/docker run flag (the engines mask differently).

# ---------------------------------------------------------------------------
# Tier 2 / Tier 3 — sandboxed runtime. A microVM is the DEFAULT: with no `runtime`
# line here, `isopod create` auto-selects an installed Tier 3 microVM runtime
# (krun/crun-vm/kata) when /dev/kvm is present, else falls back to gVisor (runsc),
# else a plain container. Pass `isopod create --container` to force a plain
# container. A `runtime <name>` directive (or ISOPOD_RUNTIME) pins a specific
# runtime and, being explicit, fails closed if it can't run.
# Tier 2 (gVisor) shares the host kernel; Tier 3 (kata, krun, crun-vm) boots a
# real microVM with its own guest kernel and needs /dev/kvm.
#
# A Tier 3 microVM is the STRONGEST fingerprint resistance isopod offers: the
# guest presents its own /proc and /sys, so host DMI/PCI/USB/disk identity never
# leaks and the Tier 1 masks below become redundant. `krun` (libkrun, Podman-
# native) is the lightest path. All of isopod's data paths (fetch/export/remap/
# copy-in) run over SSH, so they work unchanged under a microVM.
#
# Enable it from your override file or ISOPOD_RUNTIME, not by editing this
# baseline — see the header. `isopod doctor` reports the runtime's tier, /dev/kvm,
# and auto-detects which sandboxed runtimes are available to enable. Tune a krun
# guest with ISOPOD_MICROVM_ANNOTATIONS (e.g. "krun.nested_virt=1"; Podman only).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Network egress isolation. ON by default in `allow-list` mode (no `egress` line
# needed). When it can't be enforced (rootless engine, or the firewall/proxy is
# not loaded), a default-on box degrades with a warning rather than failing:
# allow-list -> lan-deny -> open. Turn it off with `no-egress` or ISOPOD_EGRESS=off;
# an EXPLICIT `egress`/`no-egress` directive (or ISOPOD_EGRESS) still fails closed
# when it can't be enforced, since you asked for it.
#
# It stops a rogue in-box agent from mapping or fingerprinting your local network:
# the box is placed on a dedicated bridge and a HOST firewall drops box-initiated
# traffic to RFC1918, the host, cloud metadata (169.254.169.254), and any internal
# DNS resolver, while public internet + DNS and host->box published ports keep
# working. All of it is enforced by the engine/host, so an agent with in-box root
# cannot turn it off.
#
# Requirements: a ROOTFUL podman/docker (a rootless engine has no host bridge to
# filter — `isopod create` refuses rather than start an unprotected box), and the
# host firewall loaded once with:   sudo isopod egress apply
# `isopod doctor` / `isopod egress status` report whether it is active.
#
# `egress allow-list` is the stricter mode: instead of allowing the public
# internet, it DENIES all egress by default and forces every box through a
# host-side filtering proxy (tinyproxy) that only permits allow-listed hostnames.
# It also needs `tinyproxy` and `systemd` on the host; `sudo isopod egress apply`
# starts the proxy as the isopod-egress-proxy unit alongside loading the firewall.
# Build the allow-list from real traffic with `sudo isopod egress observe`, then
# `isopod egress allow <domain>` for each host you approve.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Tier 1 — paths to mask (works on a shared kernel, no host setup, ON by default)
#
# Each closes a concrete host-fingerprint leak observed from inside a container:
# ---------------------------------------------------------------------------
mask /proc/cmdline file          # host boot args: LUKS UUID, root-fs UUID, ostree hash
mask /proc/modules file          # host kernel modules: VPNs (wireguard), DisplayLink, etc.
mask /sys/class/dmi              # SMBIOS: motherboard/model/BIOS vendor + dates
mask /sys/devices/virtual/dmi    # same DMI data via the devices tree
mask /sys/bus/pci               # full host PCI topology (NVMe, Wi-Fi, USB4 controllers)
mask /sys/bus/usb               # attached peripherals incl. serials (keyboard, mouse, NIC)
mask /sys/class/net             # box's own NIC name/MAC (host NICs are already
                                #   hidden by the box's network namespace)
mask /sys/class/hwmon           # sensor chips (k10temp, amdgpu, nvme) — board signature
mask /sys/class/thermal         # thermal zones
mask /sys/class/drm             # GPU model / vBIOS
mask /sys/block                 # disk models + factory serial numbers (lsblk)
mask /sys/class/block           # second alias for /sys/block (same device serials)
mask /sys/class/nvme            # NVMe controller identity/serials
mask /sys/firmware              # ACPI/DMI firmware tables (usually already masked)

# LIMITATION — these masks close the *alias* directories (/sys/class/*, /sys/bus/*,
# /sys/block) that common tools read (lsblk, ip, lspci). The underlying device
# tree at /sys/devices/ is NOT namespaced and is only partially masked (DMI is
# covered above; PCI/USB/NVMe/block device nodes are not), so a determined reader
# walking /sys/devices/... can still recover disk/PCI/USB serials. Masking the
# whole /sys/devices tree is impractical (dynamic paths, and it holds CPU/cgroup
# data tooling needs). To actually close the device tree, run the box under a
# Tier 2/3 runtime (runsc/kata/krun), which presents a synthetic /sys. See the
# README "Fingerprint hardening" section.

# Deliberately NOT masked — would break common tooling for little gain, or the
# datum is readable another way regardless; see the README "What still can't be
# mitigated" section:
#   /proc/stat     (host btime / boot epoch) — masking breaks top/htop/CPU-usage
#   /proc/cpuinfo  (CPU model/microcode)     — masking breaks build tools, and the
#                                              CPU is still readable via the CPUID
#                                              instruction regardless.
#   /proc/meminfo  (host RAM size)           — masking breaks build tools / most
#                                              memory-aware programs.
#   /proc/version  (kernel build string)     — the kernel release is already
#                                              exposed by uname(2), which no file
#                                              mask can cover on a shared kernel.
